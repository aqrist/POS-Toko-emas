<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gold Shop POS - Login</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#196ee6",
              "background-light": "#f6f7f8",
              "background-dark": "#111821",
              "card-dark": "#18212f",
              "input-dark": "#20293a",
              "border-dark": "#334155",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
        /* Custom scrollbar for modern feel */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111821; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased min-h-screen flex flex-col">
<!-- Top Navigation Bar / Header -->
<header class="w-full border-b border-gray-200 dark:border-border-dark bg-white/50 dark:bg-background-dark/80 backdrop-blur-md sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex h-16 items-center justify-between">
<!-- Left: Logo & Brand -->
<div class="flex items-center gap-3">
<div class="flex items-center justify-center size-10 rounded-lg bg-primary/10 text-primary">
<span class="material-symbols-outlined !text-[24px]">diamond</span>
</div>
<div>
<h1 class="text-lg font-bold leading-tight tracking-tight">Gold Shop POS</h1>
<p class="text-xs text-slate-500 dark:text-slate-400 font-medium">v2.4.0</p>
</div>
</div>
<!-- Right: Status & Actions -->
<div class="flex items-center gap-3">
<!-- Offline Badge -->
<div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
</span>
<span class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 whitespace-nowrap">Offline Ready</span>
</div>
<!-- Install App Button -->
<button class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-sm font-semibold transition-colors duration-200">
<span class="material-symbols-outlined !text-[18px]">download</span>
<span>Install App</span>
</button>
</div>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">
<!-- Abstract Background Decoration -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -right-[10%] w-[600px] h-[600px] rounded-full bg-primary/5 blur-[100px]"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[500px] h-[500px] rounded-full bg-purple-500/5 blur-[100px]"></div>
</div>
<!-- Login Card -->
<div class="w-full max-w-[440px] relative z-10">
<div class="bg-white dark:bg-card-dark rounded-xl shadow-2xl border border-gray-200 dark:border-border-dark overflow-hidden">
<!-- Card Header -->
<div class="px-8 pt-8 pb-6">
<div class="flex flex-col gap-2">
<h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">POS Terminal Login</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm">Please select your branch and enter your credentials to start your shift.</p>
</div>
</div>
<!-- Form -->
<div class="px-8 pb-8 flex flex-col gap-5">
<!-- Branch Selection -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 text-slate-700 dark:text-slate-300">
                            Select Branch
                        </label>
<div class="relative">
<select class="flex h-12 w-full items-center justify-between rounded-lg border border-slate-200 dark:border-border-dark bg-transparent px-3 py-2 text-sm placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent disabled:cursor-not-allowed disabled:opacity-50 dark:bg-input-dark dark:text-slate-100 appearance-none">
<option disabled="" selected="" value="">Select a location...</option>
<option value="main">Main Branch - Downtown</option>
<option value="mall">City Mall Kiosk</option>
<option value="airport">International Airport</option>
</select>
<div class="absolute right-3 top-3 pointer-events-none text-slate-500">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Username -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium leading-none text-slate-700 dark:text-slate-300">
                            Username
                        </label>
<div class="relative flex items-center">
<input class="flex h-12 w-full rounded-lg border border-slate-200 dark:border-border-dark bg-transparent px-3 py-2 pl-10 text-sm placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent disabled:cursor-not-allowed disabled:opacity-50 dark:bg-input-dark dark:text-slate-100" placeholder="admin@goldshop.com" type="text"/>
<div class="absolute left-3 text-slate-400 dark:text-slate-500 flex items-center justify-center">
<span class="material-symbols-outlined !text-[20px]">person</span>
</div>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<label class="text-sm font-medium leading-none text-slate-700 dark:text-slate-300">
                                Password
                            </label>
<a class="text-xs font-medium text-primary hover:text-primary/80 transition-colors" href="#">
                                Forgot password?
                            </a>
</div>
<div class="relative flex items-center">
<input class="flex h-12 w-full rounded-lg border border-slate-200 dark:border-border-dark bg-transparent px-3 py-2 pl-10 pr-10 text-sm placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent disabled:cursor-not-allowed disabled:opacity-50 dark:bg-input-dark dark:text-slate-100" placeholder="••••••••" type="password"/>
<div class="absolute left-3 text-slate-400 dark:text-slate-500 flex items-center justify-center">
<span class="material-symbols-outlined !text-[20px]">lock</span>
</div>
<button class="absolute right-3 text-slate-400 hover:text-slate-300 flex items-center justify-center transition-colors" type="button">
<span class="material-symbols-outlined !text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="inline-flex items-center justify-center whitespace-nowrap rounded-lg text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-white hover:bg-primary/90 h-12 px-4 py-2 w-full mt-2 shadow-lg shadow-primary/20">
                        Sign In
                    </button>
</div>
<!-- Footer of Card -->
<div class="bg-slate-50 dark:bg-[#131b26] px-8 py-4 border-t border-slate-100 dark:border-border-dark flex items-center justify-center">
<p class="text-xs text-slate-500 dark:text-slate-400 text-center">
                        Need help? Contact <a class="text-primary hover:underline" href="#">Support</a>
</p>
</div>
</div>
<!-- Install Prompt for Mobile (Visible only on small screens outside header) -->
<div class="mt-6 sm:hidden flex justify-center">
<button class="flex items-center gap-2 text-slate-400 text-sm">
<span class="material-symbols-outlined !text-[18px]">add_to_home_screen</span>
<span>Install App to Home Screen</span>
</button>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-4 text-center">
<p class="text-xs text-slate-500 dark:text-slate-600">
            © 2024 Gold Shop POS Systems. All rights reserved.
        </p>
</footer>
</body></html>
